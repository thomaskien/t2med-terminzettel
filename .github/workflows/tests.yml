name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install conversion tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript libgxps-utils
      - name: Install test dependencies
        run: python -m pip install -r terminzettel-installer/requirements-dev.txt
      - name: Shell syntax
        run: bash -n terminzettel-installer/install-terminzettel.sh
      - name: Tests (synthetic fixtures only)
        run: python -B -m unittest discover -s terminzettel-installer/tests -v
  cups-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUPS, Samba and conversion tools
        run: sudo apt-get update && sudo apt-get install -y cups samba python3-cups python3-tomli python3-qrcode python3-pil tzdata poppler-utils ghostscript libgxps-utils avahi-daemon avahi-utils
      - name: Real CUPS and Bonjour with a synthetic printer
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/cups-smoke.log"
          if ! sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS bash terminzettel-installer/tests/cups_smoke.sh 2>&1 | tee "$log"; then
            # Synthetic fixtures only; expose the failure without requiring a GitHub login.
            python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          message = '\n'.join(Path(sys.argv[1]).read_text().splitlines()[-45:])
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=CUPS integration failed::' + message)
          PY
            exit 1
          fi
