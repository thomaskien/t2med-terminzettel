# /etc/terminzettel/config.toml
# T2med-Terminbeleg -> 58-mm-Terminbon -> lokale CUPS-Warteschlange

[input]
# Wird nur für bereits als Text angelieferte Jobs benötigt.
text_encoding = "utf-8"

[output]
# Bereits vorhandene lokale CUPS-Warteschlange.
queue = "TMm10"
format = "escpos"  # escpos | text
text_encoding = "utf-8"

[escpos]
# Epson PC858: Umlaute + Euro. ESC t 19 wird vor dem Text gesendet.
encoding = "cp858"
codepage = 19
font = "A"
initialize = true

# Papier nach dem Inhalt noch etwas vorschieben.
feed_lines = 4

# partial | full | none
cut = "partial"

# Ersatzzeichen für Zeichen, die in der gewählten Codepage fehlen.
unencodable = "?"

[layout]
# TM-m10, 58 mm, Font A: sinnvoller Ausgangswert.
columns = 35
heading = "IHRE TERMINE"
heading_double_height = true
show_patient = true
footer_separator = true
separator_char = "-"

[header]
enabled = true
align = "center"
bold = true
text = """
"""

[footer]
enabled = true
align = "center"
bold = false
text = """
"""

[calendar_qr]
enabled = true
# Fester Praxistitel. Keine Patientendaten oder Termintypen einsetzen.
summary = "Termin Arztpraxis"
timezone = "Europe/Berlin"
default_duration_minutes = 15

# Optional die Praxisadresse im Kalendereintrag anzeigen.
include_location = false
location = ""

caption = "Alle Termine in Kalender übernehmen"
error_correction = "M"
quiet_zone_modules = 4
max_width_dots = 360
min_module_dots = 3
